services:
  ppe-detection-worker:
    build:
      context: .
      args:
        MODEL_SOURCE: "${MODEL_SOURCE:-training/runs/ppe_v3_person_rfdetr_medium_1024_batch6_lr5e5_v2/checkpoint_best_ema.pth}"
        MODEL_TARGET: "${MODEL_TARGET:-checkpoint_best_ema.pth}"
        FACE_MODEL_SOURCE: "${FACE_MODEL_SOURCE:-test_face_detection/yolov8n-face.pt}"
        WORKER_SOURCE: "${WORKER_SOURCE:-ppe_worker_5.py}"
    image: ai-ppe-detection:ppe-transformer-v1
    environment:
      MODEL_PATH: /app/checkpoint_best_ema.pth
      PPE_MODEL_PATH: /app/checkpoint_best_ema.pth
      PERSON_MODEL_PATH: /app/checkpoint_best_ema.pth
      SINGLE_MODEL_MODE: "TRUE"
      DETECTOR_BACKEND: "rfdetr"
      RFDETR_MODEL_SIZE: "medium"
      RFDETR_OPTIMIZE_INFERENCE: "TRUE"
      FACE_MODEL_PATH: /app/yolov8n-face.pt
      BOOT_CONFIDENCE: "0.10"
      BOOT_IOU: "0.45"
      BOOT_IMAGE_SIZE: "1024"
      BOOT_CROP_FOOT_RATIO: "0.45"
      BOOT_CROP_MARGIN: "0.20"
      BOOT_MIN_PERSON_HEIGHT: "45"
      ENABLE_BOOT_CROPS: "FALSE"
      PPE_CREDS_FILE: /app/ppe_creds.txt
      PPE_SNAPSHOT_INTERVAL: "${PPE_SNAPSHOT_INTERVAL:-40}"
      DETECTION_CONFIDENCE: "${DETECTION_CONFIDENCE:-0.05}"
      PERSON_CONFIDENCE: "${PERSON_CONFIDENCE:-0.25}"
      PERSON_IOU: "${PERSON_IOU:-0.70}"
      PERSON_IMAGE_SIZE: "${PERSON_IMAGE_SIZE:-1024}"
      PERSON_AUGMENT_MAX_SCALE: "${PERSON_AUGMENT_MAX_SCALE:-1024}"
      PERSON_FALLBACK_ENABLED: "${PERSON_FALLBACK_ENABLED:-FALSE}"
      PERSON_FALLBACK_THRESHOLD: "${PERSON_FALLBACK_THRESHOLD:-3}"
      ENABLE_CROWD_RECOVERY: "${ENABLE_CROWD_RECOVERY:-FALSE}"
      CROWD_RECOVERY_IOU_CAP: "${CROWD_RECOVERY_IOU_CAP:-0.85}"
      CROWD_RECOVERY_CONF: "${CROWD_RECOVERY_CONF:-0.20}"
      CROWD_RECOVERY_NEW_BOX_IOU: "${CROWD_RECOVERY_NEW_BOX_IOU:-0.30}"
      ENABLE_TILED_PERSON_DETECTION: "${ENABLE_TILED_PERSON_DETECTION:-FALSE}"
      PERSON_MIN_BOX_WIDTH: "${PERSON_MIN_BOX_WIDTH:-8}"
      PERSON_MIN_BOX_HEIGHT: "${PERSON_MIN_BOX_HEIGHT:-20}"
      PERSON_MIN_ASPECT_RATIO: "${PERSON_MIN_ASPECT_RATIO:-0.50}"
      PERSON_MAX_ASPECT_RATIO: "${PERSON_MAX_ASPECT_RATIO:-10.00}"
      PPE_CROP_INFERENCE_SIZE: "${PPE_CROP_INFERENCE_SIZE:-1024}"
      PPE_OWNER_MIN_OVERLAP: "${PPE_OWNER_MIN_OVERLAP:-0.20}"
      PPE_CROP_DUPLICATE_IOU: "${PPE_CROP_DUPLICATE_IOU:-0.35}"
      NO_VIOLATION_RECHECK_ENABLED: "${NO_VIOLATION_RECHECK_ENABLED:-FALSE}"
      NO_VIOLATION_RECHECK_IMAGE_SIZE: "${NO_VIOLATION_RECHECK_IMAGE_SIZE:-960}"
      NO_VIOLATION_RECHECK_CONF_MULTIPLIER: "${NO_VIOLATION_RECHECK_CONF_MULTIPLIER:-1.25}"
      NO_VIOLATION_RECHECK_PERSON_CONF: "${NO_VIOLATION_RECHECK_PERSON_CONF:-0.50}"
      PERSON_MATCH_REQUIRED: "${PERSON_MATCH_REQUIRED:-TRUE}"
      PERSON_MATCH_CONF_BYPASS: "${PERSON_MATCH_CONF_BYPASS:-0.40}"
      PERSON_BOX_EXPAND_TOP: "${PERSON_BOX_EXPAND_TOP:-0.20}"
      PERSON_BOX_EXPAND_BOTTOM: "${PERSON_BOX_EXPAND_BOTTOM:-0.20}"
      PERSON_BOX_EXPAND_SIDES: "${PERSON_BOX_EXPAND_SIDES:-0.10}"
      CLASS_CONFIDENCES: "${CLASS_CONFIDENCES:-NO-Hardhat=0.10,NO-Safety Vest=0.20,NO-Safety Boots=0.10}"
      CLOSE_PERSON_CONF_ENABLED: "${CLOSE_PERSON_CONF_ENABLED:-TRUE}"
      CLOSE_PERSON_HEIGHT_RATIO: "${CLOSE_PERSON_HEIGHT_RATIO:-0.60}"
      CLOSE_PERSON_AREA_RATIO: "${CLOSE_PERSON_AREA_RATIO:-0.22}"
      CLOSE_PERSON_CONF_BOOST: "${CLOSE_PERSON_CONF_BOOST:-0.05}"
      CLOSE_PERSON_CONF_MAX: "${CLOSE_PERSON_CONF_MAX:-0.35}"
      DETECTION_IOU: "0.45"
      IMAGE_SIZE: "${IMAGE_SIZE:-1024}"
      ENABLE_BOOT_COLOR_CHECK: "${ENABLE_BOOT_COLOR_CHECK:-FALSE}"
      BOOT_COLOR_MIN_RATIO: "${BOOT_COLOR_MIN_RATIO:-0.08}"
      CAPTURE_WORKERS: "10"
      UPLOAD_WORKERS: "10"
      DETECTION_BATCH_SIZE: "8"
      DEBUG: "FALSE"
      DRY_RUN: "${DRY_RUN:-FALSE}"
    restart: unless-stopped
